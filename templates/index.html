        // 发送消息（写入当前活动会话的运行时；其他会话的流式响应互不阻塞）
        /** 与后端 MAX_QUERY_CHARS 保持一致的前端软限制 */
        const MAX_MESSAGE_CHARS = 2000;

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            let message = input.value.trim();

            // 与后端校验口径一致：超长在发送前拦截（maxlength 硬截断会静默丢字）
            if (message.length > MAX_MESSAGE_CHARS) {
                addSystemMessage('消息过长，请控制在 ' + MAX_MESSAGE_CHARS + ' 字以内');
                return;
            }

            // 纯图片消息：文本用占位文案，保证分类器与侧栏预览可用
            if (!message && pendingImages.length > 0) {
                message = '（图片消息）';
            }

            const rt = getActiveRuntime();
            // 正在发送中（仅限本会话），或文本与图片都为空 → 中止
            if (!rt || rt.isTyping || (!message && pendingImages.length === 0)) return;

            // 快照本轮图片，并立即清空待发状态（防止发送中重复发送）
            const imagesToSend = pendingImages.slice();

            // 添加用户消息到本会话 pane（含图片缩略图）
            addMessageTo(rt, 'user', message === '（图片消息）' && imagesToSend.length > 0 ? '' : message, undefined, imagesToSend);
            input.value = '';
            clearPendingImages();
            autoGrowMessageInput();

            // Tab 标题取本条消息摘要
            setTabTitle(rt, message);

            // 本会话进入响应状态（不影响其他会话）
            rt.isTyping = true;
            rt.statusText = '';
            updateTypingIndicator();
            updateComposerSendReady();
            updateTabTyping(rt);
            renderSessionsBySearch();

            // 流式气泡上下文（出错时用于清理未完成的空壳）
            let streamCtx = null;

            try {
                const requestBody = {
                    message: message,
                    session_id: rt.sid
                };
                if (imagesToSend.length > 0) {
                    requestBody.images = imagesToSend;
                }

                const response = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                // 先建空助手气泡，边收边渲染（打字机效果）；闭包持有 rt，
                // 即使中途切换 Tab / 重命名 key，token 仍写入本会话 pane
                streamCtx = createStreamingBubble(rt);
                rt.streamCtx = streamCtx;
                let donePayload = null;
                let streamError = '';

                await consumeSSE(response.body, function (evt) {
                    if (evt.error) {
                        streamError = evt.error;
                        return;
                    }
                    if (evt.type === 'status' && evt.content) {
                        // 分类等前置阶段的进度反馈：仅在尚无正文时更新「思考中」文案
                        if (rt.streamCtx && !rt.streamCtx.text) {
                            rt.statusText = evt.content;
                            updateTypingIndicator();
                        }
                        return;
                    }
                    if (evt.type === 'done') {
                        donePayload = evt;
                        return;
                    }
                    if (evt.type === 'token' && evt.content) {
                        appendStreamChunk(streamCtx, evt.content);
                        return;
                    }
                    // 兼容旧的整段格式（后端轮询兜底路径）
                    if (evt.content && !evt.type) {
                        appendStreamChunk(streamCtx, evt.content);
                        donePayload = evt;
                    }
                });

                if (!streamCtx.text) {
                    // 一个字都没收到：移除空壳，改用提示气泡
                    const emptyRoot = streamCtx.root;
                    rt.streamCtx = null;
                    streamCtx = null;
                    emptyRoot.remove();
                    if (activeRuntimeKey === rt.key) updateChatEmptyVisibility();
                    if (streamError) {
                        console.error('流式聊天错误:', streamError);
                        addMessageTo(rt, 'assistant', '抱歉，系统出现错误：' + streamError);
                    } else {
                        addMessageTo(rt, 'assistant', '抱歉，系统返回了空响应，请稍后重试。');
                    }
                    return;
                }

                // 用服务端完整文本校准一次，保证屏幕内容与线程 state 一致（历史回显不会对不上）
                if (donePayload && donePayload.content && donePayload.content !== streamCtx.text) {
                    streamCtx.text = donePayload.content;
                }
                finishStreamingBubble(streamCtx);
                rt.streamCtx = null;
                streamCtx = null;

                if (streamError) {
                    console.error('流式聊天错误:', streamError);
                }

                const data = donePayload || {};

                // 插入本轮智能体标签（后端返回 agent / query_type 时才插）
                // 勿提前选取 :last-child，否则会误插在上一轮回复上造成「两条回复」观感
                if (data.agent || data.query_type) {
                    var agentInfo = document.createElement('div');
                    agentInfo.className = 'agent-info';
                    agentInfo.textContent =
                        '🤖 ' + (data.agent || '智能客服')
                        + ' | 📋 ' + (data.query_type || '已处理');

                    var lastAssistantContent = rt.chatContainer.querySelector(
                        '.message.assistant:last-child .message-content'
                    );
                    if (lastAssistantContent) {
                        lastAssistantContent.insertBefore(agentInfo, lastAssistantContent.firstChild);
                    }
                }

                // 首条消息后后端返回真实 LangGraph 线程 ID：
                // 重命名运行时（temp-* → thread_id），同一对话后续消息继续写入同一线程
                if (data.thread_id) {
                    renameRuntime(rt, data.thread_id);
                }

                // 刷新会话列表
                refreshSessionList();
            } catch (error) {
                console.error('发送消息失败:', error);
                // 清理可能已创建但未完成的流式空壳，避免残留空气泡
                if (rt.streamCtx) {
                    const failedRoot = rt.streamCtx.root;
                    rt.streamCtx = null;
                    failedRoot.remove();
                    if (activeRuntimeKey === rt.key) updateChatEmptyVisibility();
                }
                addMessageTo(rt, 'assistant', '抱歉，网络连接出现问题，请稍后重试。');
            } finally {
                rt.isTyping = false;
                rt.statusText = '';
                rt.streamCtx = null;
                if (activeRuntimeKey === rt.key) updateTypingIndicator();
                updateComposerSendReady();
                updateTabTyping(rt);
                renderSessionsBySearch();
                if (activeRuntimeKey === rt.key) {
                    updateChatEmptyVisibility();
                    autoGrowMessageInput();
                }
            }
        }

        function copyPlainTextToClipboard(text) {
            var t = text == null ? '' : String(text);
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(t);
            }
            return new Promise(function (resolve, reject) {
                try {
                    var ta = document.createElement('textarea');
                    ta.value = t;
                    ta.setAttribute('readonly', '');
                    ta.style.position = 'fixed';
                    ta.style.left = '-9999px';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    resolve();
                } catch (err) {
                    reject(err);
                }
            });
        }

        function getMessageBodyText(messageRoot) {
            var body = messageRoot.querySelector('.message-body');
            if (!body) return '';
            return (body.innerText || body.textContent || '').trim();
        }

        function buildMessageActionsBar(messageRoot) {
            var bar = document.createElement('div');
            bar.className = 'message-actions';
            bar.setAttribute('role', 'toolbar');
            bar.setAttribute('aria-label', '复制消息');

            function iconBtn(title, ariaLabel, paths) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'msg-action-btn';
                b.title = title;
                b.setAttribute('aria-label', ariaLabel);
                b.innerHTML =
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
                return b;
            }

            var copyPaths = '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';

            var btnCopy = iconBtn('复制', '复制全文', copyPaths);

            btnCopy.addEventListener('click', function (e) {
                e.stopPropagation();
                var txt = getMessageBodyText(messageRoot);
                if (!txt) return;
                copyPlainTextToClipboard(txt).then(function () {
                    var prev = btnCopy.title;
                    btnCopy.title = '已复制';
                    setTimeout(function () { btnCopy.title = prev; }, 1600);
                }).catch(function () {
                    btnCopy.title = '复制失败';
                    setTimeout(function () { btnCopy.title = '复制'; }, 1600);
                });
            });

            bar.appendChild(btnCopy);
            return bar;
        }

        function insertMessageActionsBeforeMeta(scopeContainer, messageRoot) {
            var meta = scopeContainer.querySelector('.message-meta');
            if (!meta) return;
            scopeContainer.insertBefore(buildMessageActionsBar(messageRoot), meta);
        }

        // 添加消息到界面
        // ==================== 流式输出（SSE） ====================

        /**
         * 逐块读取 SSE 响应体，按空行切分事件块后回调。
         * TextDecoder({stream:true}) 处理跨 chunk 的多字节字符；保留未结束的尾部缓冲，
         * 避免一条 JSON 被切在两个网络分片里导致解析失败。
         */
        async function consumeSSE(stream, onEvent) {
            if (!stream) throw new Error('响应体不可读');
            const reader = stream.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';

            try {
                while (true) {
                    const { done, value } = await reader.read();
                    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
                    if (done) break;

                    let sepIdx;
                    while ((sepIdx = buffer.indexOf('\n\n')) !== -1) {
                        const block = buffer.slice(0, sepIdx);
                        buffer = buffer.slice(sepIdx + 2);
                        handleSSEBlock(block, onEvent);
                    }
                }
                // 流结束：处理残留的最后一个事件块
                if (buffer.trim()) handleSSEBlock(buffer, onEvent);
            } finally {
                try { reader.releaseLock(); } catch (e) { /* 流已关闭，忽略 */ }
            }
        }

        /** 解析单个 SSE 事件块（可能含多行 data:），把 JSON 载荷交给回调。 */
        function handleSSEBlock(block, onEvent) {
            var dataLines = [];
            String(block).split('\n').forEach(function (line) {
                if (line.indexOf('data:') === 0) {
                    dataLines.push(line.slice(5).trim());
                }
            });
            if (dataLines.length === 0) return;

            var raw = dataLines.join('\n');
            if (raw === '[DONE]') return;   // 结束标记，无需向下传

            var payload = null;
            try {
                payload = JSON.parse(raw);
            } catch (e) {
                console.warn('[stream] 无法解析的 SSE 载荷:', raw);
                return;
            }
            onEvent(payload);
        }

        /**
         * 创建流式助手气泡：先建空壳，随后逐块填充形成打字机效果。
         * 气泡挂在指定会话的 pane 内（后台会话同样照常接收 token）。
         * 返回的 ctx 持有 body 节点与累积文本，供 appendStreamChunk / finishStreamingBubble 使用。
         */
        function createStreamingBubble(rt) {
            const chatContainer = rt.chatContainer;
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            const body = document.createElement('div');
            body.className = 'message-body';
            contentDiv.appendChild(body);

            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            if (activeRuntimeKey === rt.key) updateChatEmptyVisibility();

            return {
                root: messageDiv,
                contentDiv: contentDiv,
                body: body,
                container: chatContainer,
                text: '',
                rafId: null,
                firstChunk: true
            };
        }

        /**
         * 追加一段流式文本。
         * - requestAnimationFrame 节流：LLM 每秒可吐几十个 token，逐个改 DOM 会掉帧
         * - 流式期间只用纯文本：Markdown 留到收尾一次性渲染，
         *   否则未闭合语法（如 ``` 代码块）会在中途闪烁错乱
         * - 滚动只作用于气泡所属 pane：非激活会话的内容在后台照常累积
         */
        function appendStreamChunk(ctx, chunk) {
            if (!ctx || !chunk) return;
            ctx.text += chunk;

            if (ctx.firstChunk) {
                ctx.firstChunk = false;
                // 首 token 到达：本会话不再处于「等待阶段」，收起指示器（若为激活会话）
                updateTypingIndicator();
            }

            if (ctx.rafId !== null) return;
            ctx.rafId = window.requestAnimationFrame(function () {
                ctx.rafId = null;
                ctx.body.textContent = ctx.text;
                if (ctx.container) ctx.container.scrollTop = ctx.container.scrollHeight;
            });
        }

        /**
         * 流式收尾：取消挂起帧 -> 一次性 Markdown 渲染 -> 补元信息与复制按钮。
         * 终态与 addMessageTo(rt, 'assistant', ...) 保持一致。
         */
        function finishStreamingBubble(ctx, tsOpt) {
            if (!ctx) return;

            if (ctx.rafId !== null) {
                window.cancelAnimationFrame(ctx.rafId);
                ctx.rafId = null;
            }

            const text = ctx.text;
            ctx.body.innerHTML = '';
            if (text) {
                // 复用既有 Markdown 管线（marked + DOMPurify）；CDN 不可用时回退纯文本
                let appliedMarkdown = false;
                if (canUseMarkdownPipeline()) {
                    try {
                        const dirty = marked.parse(text, { breaks: false, gfm: true });
                        ctx.body.innerHTML = DOMPurify.sanitize(dirty);
                        ctx.body.classList.add('md-body');
                        appliedMarkdown = true;
                    } catch (e) {
                        console.warn('[markdown] 流式收尾解析失败，回退为原始展示:', e);
                    }
                }
                if (!appliedMarkdown) ctx.body.textContent = text;
            }

            attachMessageMeta(ctx.contentDiv, '智能客服', tsOpt);
            insertMessageActionsBeforeMeta(ctx.contentDiv, ctx.root);

            if (ctx.container) ctx.container.scrollTop = ctx.container.scrollHeight;
        }

        // 添加消息到界面（containerOpt 缺省时写入当前活动会话的 pane）
        function addMessageTo(rt, role, content, tsOpt, imageUrls) {
            const chatContainer = rt && rt.chatContainer
                ? rt.chatContainer
                : (getActiveRuntime() || { chatContainer: null }).chatContainer;
            if (!chatContainer) return;
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';

            // 图片缩略图列表（点击新窗口查看大图）；兼容旧的单图字符串
            var imgList = [];
            if (typeof imageUrls === 'string' && imageUrls) {
                imgList = [imageUrls];
            } else if (Array.isArray(imageUrls)) {
                imgList = imageUrls;
            }
            imgList.forEach(function (url) {
                if (!url) return;
                var imgEl = document.createElement('img');
                imgEl.className = 'message-image';
                imgEl.src = url;
                imgEl.alt = '客户上传的图片';
                imgEl.addEventListener('click', function () {
                    var w = window.open();
                    if (w) {
                        // 用 DOM API 构建预览页：url 直接赋给 img.src，
                        // 不做字符串拼接，避免含引号的 URL 逃逸标签注入
                        var doc = w.document;
                        doc.title = '图片预览';
                        doc.body.style.cssText =
                            'margin:0;background:#111;display:flex;align-items:center;justify-content:center;';
                        var preview = doc.createElement('img');
                        preview.style.cssText = 'max-width:100%;max-height:100vh;';
                        preview.src = url;
                        doc.body.appendChild(preview);
                    }
                });
                contentDiv.appendChild(imgEl);
            });

            if (content !== undefined && content !== null && String(content) !== '') {
                attachMessageBody(contentDiv, content, role === 'assistant');
            }

            if (role === 'user') {
                const wrap = document.createElement('div');
                wrap.className = 'message-user-wrap';
                wrap.appendChild(contentDiv);
                attachMessageMeta(wrap, '您', tsOpt);
                insertMessageActionsBeforeMeta(wrap, messageDiv);
                messageDiv.appendChild(wrap);
            } else {
                attachMessageMeta(contentDiv, '智能客服', tsOpt);
                insertMessageActionsBeforeMeta(contentDiv, messageDiv);
                messageDiv.appendChild(contentDiv);
            }

            chatContainer.appendChild(messageDiv);
            if (!rt || activeRuntimeKey === rt.key) updateChatEmptyVisibility();

            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        /** 兼容入口：写入当前活动会话的 pane */
        function addMessage(role, content, tsOpt, imageUrls) {
            addMessageTo(getActiveRuntime(), role, content, tsOpt, imageUrls);
        }

        // 添加系统消息（写入当前活动会话的 pane）
        function addSystemMessage(content, tsOpt) {
            const rt = getActiveRuntime();
            if (!rt || !rt.chatContainer) return;
            const chatContainer = rt.chatContainer;
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            attachMessageBody(contentDiv, content, true);
            attachMessageMeta(contentDiv, '系统消息', tsOpt);
            insertMessageActionsBeforeMeta(contentDiv, messageDiv);

            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            updateChatEmptyVisibility();

            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 显示输入指示器：按活动会话的运行时状态渲染（等待中且尚无正文才显示）
        function updateTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            const dots = indicator && indicator.querySelector('.typing-dots');
            if (!indicator || !dots) return;

            const rt = getActiveRuntime();
            const waiting = !!(rt && rt.isTyping && rt.streamCtx && !rt.streamCtx.text);
            if (waiting) {
                dots.textContent = rt.statusText || '智能体正在思考中';
                indicator.style.display = 'block';
                rt.chatContainer.scrollTop = rt.chatContainer.scrollHeight;
            } else {
                indicator.style.display = 'none';
            }
        }

        // ==================== 图片上传 ====================

        /** 原始文件大小上限（压缩前）10MB */
        const MAX_IMAGE_FILE_SIZE = 10 * 1024 * 1024;
        /** 压缩后最长边像素 */
        const IMAGE_MAX_EDGE = 1280;
        const ALLOWED_IMAGE_TYPES = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];

        /** 最大图片数量 */
        const MAX_PENDING_IMAGES = 4;
        /** GIF 不压缩直传，与后端单图解码后 5MB 上限保持一致（超限发送阶段必被 400 拒收） */
        const MAX_GIF_FILE_SIZE = 5 * 1024 * 1024;

        /** 刷新预览条 DOM（根据 pendingImages 数组重新渲染缩略图列表） */
        function renderImagePreviews() {
            const strip = document.getElementById('imagePreviewStrip');
            const btn = document.getElementById('imageUploadBtn');
            if (!strip) return;
            strip.innerHTML = '';
            if (pendingImages.length === 0) {
                strip.classList.remove('visible');
                if (btn) btn.classList.remove('has-image');
            } else {
                strip.classList.add('visible');
                if (btn) btn.classList.add('has-image');
                pendingImages.forEach(function (dataUrl, idx) {
                    var item = document.createElement('div');
                    item.className = 'image-preview-item';
                    var imgEl = document.createElement('img');
                    imgEl.src = dataUrl;
                    imgEl.alt = '待发送图片预览';
                    var rmBtn = document.createElement('button');
                    rmBtn.type = 'button';
                    rmBtn.className = 'image-preview-remove';
                    rmBtn.title = '移除图片';
                    rmBtn.setAttribute('aria-label', '移除图片');
                    rmBtn.textContent = '×';
                    rmBtn.addEventListener('click', function () {
                        pendingImages.splice(idx, 1);
                        renderImagePreviews();
                        updateComposerSendReady();
                    });
                    item.appendChild(imgEl);
                    item.appendChild(rmBtn);
                    strip.appendChild(item);
                });
            }
        }

        /** 添加一张待发送图片（压缩后 data URL） */
        function addPendingImage(dataUrl) {
            if (pendingImages.length >= MAX_PENDING_IMAGES) {
                addSystemMessage('最多只能上传 ' + MAX_PENDING_IMAGES + ' 张图片');
                return;
            }
            pendingImages.push(dataUrl);
            renderImagePreviews();
            updateComposerSendReady();
        }

        /** 清空所有待发送图片 */
        function clearPendingImages() {
            pendingImages = [];
            renderImagePreviews();
            updateComposerSendReady();
        }

        /** 读取并压缩图片：最长边 ≤ 1280px，JPEG 0.8；PNG 透明图保留 PNG；GIF 不压缩保留首帧以外的原样直传 */
        function compressImageFile(file) {
            return new Promise(function (resolve, reject) {
                // GIF 直接读取（canvas 会丢动画），超出大小限制由后端/前面校验拦截
                if (file.type === 'image/gif') {
                    const reader = new FileReader();
                    reader.onload = function () { resolve(reader.result); };
                    reader.onerror = function () { reject(new Error('图片读取失败')); };
                    reader.readAsDataURL(file);
                    return;
                }

                const reader = new FileReader();
                reader.onload = function (ev) {
                    const img = new Image();
                    img.onload = function () {
                        let { width, height } = img;
                        if (width > IMAGE_MAX_EDGE || height > IMAGE_MAX_EDGE) {
                            if (width >= height) {
                                height = Math.round(height * IMAGE_MAX_EDGE / width);
                                width = IMAGE_MAX_EDGE;
                            } else {
                                width = Math.round(width * IMAGE_MAX_EDGE / height);
                                height = IMAGE_MAX_EDGE;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // 支持透明的 PNG/WebP 保持原格式，其余统一 JPEG
                        const keepPng = file.type === 'image/png' || file.type === 'image/webp';
                        try {
                            const out = keepPng
                                ? canvas.toDataURL(file.type)
                                : canvas.toDataURL('image/jpeg', 0.8);
                            resolve(out);
                        } catch (e) {
                            reject(new Error('图片压缩失败'));
                        }
                    };
                    img.onerror = function () { reject(new Error('图片解析失败')); };
                    img.src = ev.target.result;
                };
                reader.onerror = function () { reject(new Error('图片读取失败')); };
                reader.readAsDataURL(file);
            });
        }

        /** 处理文件选择：校验 → 压缩 → 预览 */
        async function handleImageFileSelected(file) {
            if (!file) return;
            if (ALLOWED_IMAGE_TYPES.indexOf(file.type) === -1) {
                addSystemMessage('仅支持 PNG / JPEG / WebP / GIF 格式的图片');
                return;
            }
            if (file.size > MAX_IMAGE_FILE_SIZE) {
                addSystemMessage('图片过大，请选择 10MB 以内的图片');
                return;
            }
            if (file.type === 'image/gif' && file.size > MAX_GIF_FILE_SIZE) {
                addSystemMessage('GIF 图片不支持压缩，请选择 5MB 以内的动图');
                return;
            }
            try {
                const dataUrl = await compressImageFile(file);
                addPendingImage(dataUrl);
            } catch (e) {
                addSystemMessage('图片处理失败：' + e.message);
            }
        }

        (function setupImageUpload() {
            const fileInput = document.getElementById('imageFileInput');
            const uploadBtn = document.getElementById('imageUploadBtn');

            if (uploadBtn && fileInput) {
                uploadBtn.addEventListener('click', function () {
                    fileInput.value = '';
                    fileInput.click();
                });
                fileInput.addEventListener('change', function () {
                    if (fileInput.files && fileInput.files[0]) {
                        handleImageFileSelected(fileInput.files[0]);
                    }
                });
            }
        })();

        // Enter 发送；Shift+Enter 换行（多行输入框）
        document.getElementById('messageInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 侧栏历史对话搜索：输入实时过滤，× 清除
        (function setupSessionSearch() {
            const searchInput = document.getElementById('sessionSearchInput');
            const clearBtn = document.getElementById('sessionSearchClear');
            if (!searchInput) return;

            searchInput.addEventListener('input', renderSessionsBySearch);

            if (clearBtn) {
                clearBtn.addEventListener('click', function () {
                    searchInput.value = '';
                    searchInput.focus();
                    renderSessionsBySearch();
                });
            }
        })();

        // 测试服务连通性（健康检查 + 数据库探测）
        async function testLangGraphAPI() {
            try {
                console.log('🧪 开始测试服务连通性...');

                const response = await fetch('/api/health');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('🧪 连通性测试结果:', data);

                if (data.status === 'healthy') {
                    addSystemMessage('🧪 连通性正常: ✅ 服务 | ✅ 数据库');
                } else if (data.status === 'degraded') {
                    addSystemMessage('🧪 连通性降级: ✅ 服务 | ❌ 数据库');
                } else {
                    addSystemMessage('❌ 连通性异常: 未知状态 ' + (data.status || ''));
                }
            } catch (error) {
                console.error('🧪 连通性测试失败:', error);
                addSystemMessage('❌ 连通性测试失败: ' + error.message);
            }
        }

        // ==================== 应用初始化（bootstrap） ====================
        // 脚本位于 body 末尾，DOM 已就绪，立即执行；不挂在 window.load 上——
        // CDN 脚本挂起会推迟 load 事件，导致应用长时间无法初始化。
        loadMarkdownLibraries();
        const initTa = document.getElementById('messageInput');
        if (initTa) {
            initTa.addEventListener('input', function () {
                autoGrowMessageInput();
                updateComposerSendReady();
            });
        }
        initSuggestPrompts();
        initSessionSidebarActions();
        refreshSessionList();
        createNewSession();
        updateComposerSendReady();
        autoGrowMessageInput();
        updateChatEmptyVisibility();
        if (initTa) initTa.focus();
    </script>
</body>

</html>
