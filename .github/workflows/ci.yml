# CI：main 的 CI 是 Deploy 门禁（成功后触发 CD）；分支验证统一走 PR，
# 避免「push 已跑 + PR 再跑」的同 commit 重复构建
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖（lock 全量）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: 依赖一致性检查（pip check）
        run: python -m pip check

      - name: 运行测试
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests/ -q

      - name: Docker 构建冒烟（不推送，验证 Dockerfile 可用）
        run: docker build -t cs-agent:ci-smoke .
