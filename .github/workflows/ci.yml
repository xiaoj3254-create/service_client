# CI：推送/PR 即跑测试，红了拦截部署
name: CI

on:
  push:
    branches: [main, "云部署"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖（lock 全量）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: 依赖一致性检查（pip check）
        run: python -m pip check

      - name: 运行测试
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests/ -q

      - name: Docker 构建冒烟（不推送，验证 Dockerfile 可用）
        run: docker build -t cs-agent:ci-smoke .
