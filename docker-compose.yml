services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs_pass_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-customer_service}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    # CI/CD：与 GitHub Actions deploy.yml 的 IMAGE 保持一致（可在 .env 覆盖 ACR_IMAGE）
    image: ${ACR_IMAGE:-crpi-ok3wzukbukd4o6wq.cn-hangzhou.personal.cr.aliyuncs.com/xiaodf/cs-agent}:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # checkpointer 与线程注册表共用 Postgres；compose 内固定指向 postgres 服务
      DATABASE_URL: postgresql://${POSTGRES_USER:-cs}:${POSTGRES_PASSWORD:-cs_pass_change_me}@postgres:5432/${POSTGRES_DB:-customer_service}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      # Watchtower 只重建带此标签的容器（nginx/postgres 不受影响）
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - chroma_data:/app/chroma_db   # RAG 向量库持久化
    expose:
      - "8000"                        # 仅 nginx 可达，不对宿主机开放
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CD：轮询 ACR 发现新 latest 镜像后自动 pull 并仅重建带 label 的 app 容器
  # 前置：服务器执行过 docker login <ACR域名>（凭据在 /root/.docker/config.json）
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /root/.docker/config.json:/config.json:ro
    command: --label-enable --interval 60 --cleanup

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # 域名备案完成并配置证书后取消注释 443
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/var/www/static:ro   # 静态资源直出，不占应用 worker
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  chroma_data:
