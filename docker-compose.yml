services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs_pass_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-customer_service}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # checkpointer 与线程注册表共用 Postgres；compose 内固定指向 postgres 服务
      DATABASE_URL: postgresql://${POSTGRES_USER:-cs}:${POSTGRES_PASSWORD:-cs_pass_change_me}@postgres:5432/${POSTGRES_DB:-customer_service}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_db   # RAG 向量库持久化
    expose:
      - "8000"                        # 仅 nginx 可达，不对宿主机开放
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # 域名备案完成并配置证书后取消注释 443
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/var/www/static:ro   # 静态资源直出，不占应用 worker
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  chroma_data:
