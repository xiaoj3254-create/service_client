# 每 IP 请求速率兜底（应用层另有用户/IP 双窗口限流；此处挡脚本洪泛）
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

server {
    listen 80;
    # 备案完成启用 HTTPS 后改为：listen 443 ssl; 并补 ssl_certificate 配置
    # （届时同步启用 add_header Content-Security-Policy upgrade-insecure-requests 与 HSTS）

    # 基础安全头：防 MIME 嗅探与点击劫持（HTTPS 后再加 Strict-Transport-Security）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 与应用 MAX_CONTENT_LENGTH_MB 对齐（图片 base64 上限）
    client_max_body_size 32m;

    # 静态资源直出（vendor 库 + 字体等）
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API：SSE 直通，禁缓冲
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆写而非追加（$proxy_add_x_forwarded_for）：客户端可伪造 XFF 首段；
        # nginx 是唯一可信入口，覆写后 uvicorn --proxy-headers 还原的才是真实 IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;           # SSE 逐 token 直达浏览器
        proxy_cache off;
        proxy_read_timeout 300s;       # 长回答/排队容忍
        proxy_send_timeout 300s;
        limit_req zone=api_per_ip burst=40 nodelay;
    }

    # 页面（限流兜底与 /api/ 同一 zone，挡 HTML 层洪泛）
    location / {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
